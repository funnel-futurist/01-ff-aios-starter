name: Repository standards pilot

on:
  pull_request:

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check standards template and new browsable folders
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 00-standards/check.py "$BASE_SHA"
