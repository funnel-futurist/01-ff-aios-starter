# Converged PR auto-reviewer — event-driven, one brain (pr_review skill), GitHub-enforced gate.
#
# Four jobs:
#   static_checks — deterministic floor (no LLM). REQUIRED status check. Fails only on a true BLOCK.
#   ai_review     — runs the pr_review skill via claude-code-action. Posts the review, writes verdict.json.
#                   It reads and comments; it never changes the branch (LW-21).
#   gate          — deterministic. Sets the `pr-gate` commit status and decides auto-merge eligibility.
#   automerge     — enables native auto-merge, only when the repo variable PR_AUTOMERGE is "on" and the
#                   gate said eligible. The only job that can write to the repository.
#
# Supply chain (LW-21): every action is pinned to a full commit SHA, with its version as a comment.
# A tag can be moved to different code; a SHA can't. Bump pins in the template, then ship a release.
#
# Gating model (all GitHub-enforced):
#   Tier 1 (in-lane, low-risk, eligible)        -> auto-merge, no human
#   Tier 2 (touches a CODEOWNERS path)          -> require_code_owner_reviews holds it for a code owner
#   Tier 3 (secrets / destructive migration)    -> static_checks fails -> unmergeable
#
# Fail asymmetry: blocking fails OPEN (a bug never blocks a human); auto-merge fails CLOSED
# (any uncertainty -> not eligible -> human merges).

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel a stale review when a new commit is pushed — no push/review/push loop.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Nothing by default: each job asks for only what it uses (LW-21).
permissions: {}

jobs:
  # ── 1. Deterministic floor — required status check, zero deps, zero cost ──────
  static_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip forks (no secrets there); internal org PRs come from branches, not forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read           # check out the code
      pull-requests: read      # gh pr diff / gh pr view
    outputs:
      has_block: ${{ steps.run.outputs.has_block }}
      overall: ${{ steps.run.outputs.overall }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect PR diff + metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr diff "$PR" --repo "$REPO" > diff.txt || true
          gh pr view "$PR" --repo "$REPO" --json files,additions,deletions \
            -q '{files: [.files[].path], additions: .additions, deletions: .deletions}' > meta.base.json
          # Repeatable guardrail: audit the WHOLE repo for tracked symlinks with untracked targets
          # (they dangle on every fresh clone). Merge the result into meta as dangling_symlinks.
          node scripts/pr_review/symlink_audit.mjs > dangling.json || echo "[]" > dangling.json
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('meta.base.json'));m.dangling_symlinks=JSON.parse(fs.readFileSync('dangling.json'));fs.writeFileSync('meta.json',JSON.stringify(m));"
      - name: Run deterministic checks
        id: run
        run: |
          set +e
          node scripts/pr_review/static_checks.mjs diff.txt meta.json --out static_verdict.json
          code=$?
          set -e
          overall=$(node -e "console.log(JSON.parse(require('fs').readFileSync('static_verdict.json')).overall)")
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          echo "has_block=$([ "$code" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit $code      # exit 1 on BLOCK -> this required check goes red
      - name: Persist verdict for the gate job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static_verdict
          path: static_verdict.json
          retention-days: 3
          if-no-files-found: ignore

  # ── 2. The brain — pr_review skill via the official action ────────────────────
  ai_review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static_checks
    # Skip the (paid) deep review when the deterministic floor already hard-blocks. Matches the cron.
    if: needs.static_checks.outputs.has_block != 'true'
    permissions:
      contents: read           # read the code; the reviewer never pushes (LW-21)
      pull-requests: write     # post the review and its comment
      id-token: write          # claude-code-action's own sign-in (OIDC); not a repository write
    env:
      # "No credential configured" and "the reviewer crashed" are different facts and must not
      # look the same. Without this, a repo that never configured a key shows a red X on every
      # single PR — and a check that is always red is a check nobody reads.
      HAS_CLAUDE_CREDENTIAL: ${{ (secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '') && 'yes' || 'no' }}
    steps:
      - name: AI review is not configured
        if: env.HAS_CLAUDE_CREDENTIAL != 'yes'
        run: |
          echo "::warning title=AI review not configured::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret is set for this repository, so no AI review ran. The deterministic floor (static_checks) still ran. This PR needs a human review before merge."
          printf '%s\n' '{"configured": false, "reason": "no ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret"}' > verdict.json
          { echo "### AI review"; echo; echo "**Not configured** — no Claude credential secret on this repository."; echo "The deterministic floor still ran. A human reviews this PR."; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.HAS_CLAUDE_CREDENTIAL == 'yes'
        with:
          fetch-depth: 0
          persist-credentials: false   # no git credential left on disk: the reviewer reads, it doesn't push
      - name: Discard review files from the pull request
        # verdict.json and the review text come only from the reviewer below. A copy in the pull request is
        # removed before the review runs, and a pull request that tracks verdict.json is refused.
        if: env.HAS_CLAUDE_CREDENTIAL == 'yes'
        run: |
          rm -f verdict.json review.md review_comment.md
          if git ls-files --error-unmatch verdict.json >/dev/null 2>&1; then
            echo "::error::This pull request commits verdict.json, which only the reviewer writes. It is refused."
            exit 1
          fi
      - name: Collect the pull request for the reviewer
        # The reviewer gets the pull request as files and no credential at all; this step and
        # "Post the review" below hold the token, and both are deterministic.
        if: env.HAS_CLAUDE_CREDENTIAL == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .pr_context
          gh pr view "$PR" --repo "$REPO" --json number,title,body,author,baseRefName,headRefName,files,additions,deletions > .pr_context/pr.json
          gh pr diff "$PR" --repo "$REPO" > .pr_context/diff.txt
      - name: Restore .claude/ from the base branch
        # The skill, settings and hooks the reviewer runs come from the base branch, fetched by name now, never
        # from the pull request under review. The token is used for this one fetch and isn't written to disk.
        if: env.HAS_CLAUDE_CREDENTIAL == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git fetch --no-tags origin "refs/heads/$BASE_REF"
          rm -rf .claude
          git archive FETCH_HEAD .claude | tar -x -f -
          test -d .claude
      - name: Claude review (pr_review skill)
        id: claude_review
        continue-on-error: true   # the review counts if verdict.json is valid (see 'Require a valid verdict'); timeout-minutes is the runaway guard
        if: env.HAS_CLAUDE_CREDENTIAL == 'yes'
        uses: anthropics/claude-code-action@34968b5981d5d170904281aa3df6f3c0d4a28855 # v1.0.249
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # A subscription token from `claude setup-token` works too, so a client without API
          # billing can still run the reviewer.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pull requests opened by automation (an agent's app, a dependency bot) still get reviewed.
          allowed_bots: "*"
          prompt: "/pr_review ${{ github.repository }} ${{ github.event.pull_request.number }}"
          # The tools are the boundary, not the prompt: the reviewer can read the tree and
          # .pr_context/, and write two files, review.md and verdict.json. No shell, no GitHub
          # token, so a prompt-injected diff can't change the branch, post on its own, or read a
          # credential. "Post the review" publishes what it wrote.
          claude_args: |
            --model claude-sonnet-4-6
            --allowedTools "Read,Glob,Grep,Edit(./review.md),Edit(./verdict.json)"
            --append-system-prompt "You are running headless in GitHub Actions CI as the always-on PR reviewer. Follow the pr_review skill CI mode exactly. The pull request is in ./.pr_context/ (pr.json and diff.txt); you have no shell and no GitHub access. Review with intent; SUGGEST safe mechanical fixes as exact changes; never edit any other file. Write your review comment to ./review.md and ALWAYS write ./verdict.json per the skill schema; a later workflow step posts them."
        # DB-free v1: no DATABASE_CONNECTION_URL on the runner (smallest attack surface, matches
        # the client version). Schema-checks downgraded to "flag for human" in the skill.
      - name: Post the review
        # Deterministic: approve unless the verdict has an error-severity issue, then request
        # changes. If this repository doesn't let Actions approve, it comments instead. It posts only when the
        # review step itself succeeded, so a reviewer that failed or wrote nothing posts nothing.
        if: always() && env.HAS_CLAUDE_CREDENTIAL == 'yes' && steps.claude_review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          [ -f verdict.json ] || { echo "no verdict.json, nothing to post"; exit 0; }
          event=$(node -e 'const v=JSON.parse(require("fs").readFileSync("verdict.json","utf8")); console.log(v.has_error_severity ? "--request-changes" : "--approve")') || exit 0
          [ -s review.md ] || node -e 'const v=JSON.parse(require("fs").readFileSync("verdict.json","utf8")); require("fs").writeFileSync("review.md", String(v.plain_english || v.summary || "Reviewed."))'
          gh pr review "$PR" --repo "$REPO" "$event" --body-file review.md \
            || gh pr review "$PR" --repo "$REPO" --comment --body-file review.md \
            || echo "::warning::could not post the review"
      - name: Persist verdict for the gate job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai_verdict
          path: verdict.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Require a valid verdict (a finished review passes even if the action reported an error)
        # Only where a review could run: without a credential the review step is skipped, and an unconditional
        # check failed ai_review on every PR (as it did on #23 while #22 was on main).
        if: always() && env.HAS_CLAUDE_CREDENTIAL == 'yes'
        run: |
          node -e 'const fs=require("fs"); let v; try { v=JSON.parse(fs.readFileSync("verdict.json","utf8")); } catch (e) { process.exit(1); } const q=v && v.quality_score; process.exit(typeof q==="number" && q>=1 && q<=10 ? 0 : 1);' \
            || { echo "::error::No valid verdict.json - the AI review did not finish"; exit 1; }

  # ── 3. Deterministic gate — sets pr-gate status + decides auto-merge eligibility ─
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static_checks, ai_review]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      statuses: write          # set the pr-gate commit status; nothing else
    outputs:
      eligible: ${{ steps.decide.outputs.eligible }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: ai_verdict, path: ., merge-multiple: true }
        continue-on-error: true            # ai_review may have been skipped (hard block) — handled below
      - name: Decide gate + auto-merge eligibility
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          STATIC_BLOCK: ${{ needs.static_checks.outputs.has_block }}
          AI_RESULT: ${{ needs.ai_review.result }}
          PR_AUTOMERGE: ${{ vars.PR_AUTOMERGE }}   # repo variable; unset/!="on" => auto-merge DISARMED (bake mode + kill-switch)
        run: |
          node <<'EOF'
          const fs = require('fs');
          const { GH_TOKEN, PR, REPO, HEAD_SHA, ADDITIONS, STATIC_BLOCK, AI_RESULT } = process.env;
          const sh = (c) => require('child_process').execSync(c, { stdio: 'pipe' }).toString().trim();

          // Read the AI verdict if present; fail CLOSED for auto-merge on any uncertainty.
          let v = null;
          try { v = JSON.parse(fs.readFileSync('verdict.json', 'utf8')); } catch {}

          const staticBlocked = STATIC_BLOCK === 'true';
          const notConfigured = !!(v && v.configured === false);
          const aiErrored = AI_RESULT !== 'success' && AI_RESULT !== 'skipped';
          const hasErrorSeverity = !!(v && v.has_error_severity);
          const codeownerTouched = !!(v && v.codeowner_path_touched);
          const score = (v && Number(v.quality_score)) || 0;
          const adds = Number(ADDITIONS) || 0;

          // pr-gate status: FAIL only on a real block signal. Otherwise success (do not block humans
          // on an AI crash — the deterministic floor already guarded the dangerous stuff).
          const gateFail = staticBlocked || hasErrorSeverity;
          const state = gateFail ? 'failure' : 'success';
          const desc = staticBlocked ? 'Blocked by deterministic floor'
            : hasErrorSeverity ? 'AI review found error-severity issues'
            : notConfigured ? 'AI review not configured - manual merge only'
            : aiErrored ? 'AI review did not complete - manual merge only'
            : 'Passed review';
          const safeDesc = desc.replace(/'/g, '').slice(0, 140);
          sh(`gh api -X POST repos/${REPO}/statuses/${HEAD_SHA} ` +
             `-f state=${state} -f context=pr-gate -f description='${safeDesc}'`);

          // Tiering (deterministic — from the cron). Eligible => enable native auto-merge.
          const tierEligible =
            (adds <= 200 && score >= 7) || (adds <= 500 && score >= 8) || (adds <= 1000 && score >= 9);
          const eligible = !gateFail && !aiErrored && !notConfigured && !codeownerTouched && v && tierEligible;
          const armed = process.env.PR_AUTOMERGE === 'on';   // repo variable; OFF during bake = kill-switch

          // The merge itself is the automerge job's: it alone holds write access, and it runs only
          // when PR_AUTOMERGE is "on" and this says eligible.
          fs.appendFileSync(process.env.GITHUB_OUTPUT || '/dev/null', `eligible=${eligible ? 'true' : 'false'}\n`);

          let mergeNote = 'manual merge';
          if (eligible && armed) {
            mergeNote = `eligible (${adds} lines, score ${score}/10) — the automerge job enables auto-merge`;
          } else if (eligible && !armed) {
            mergeNote = `eligible (${adds} lines, score ${score}/10) — auto-merge DISARMED (PR_AUTOMERGE != on)`;
          } else if (notConfigured) {
            mergeNote = 'AI review not configured - human review required';
          } else if (codeownerTouched) {
            mergeNote = 'escalated to a code owner';
          } else if (staticBlocked || hasErrorSeverity) {
            mergeNote = 'blocked';
          }

          console.log(`pr-gate=${state} | ${desc} | ${mergeNote}`);
          fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY || '/dev/null',
            `### Gate\n- pr-gate: **${state}** (${desc})\n- merge: **${mergeNote}**\n- score: ${score}/10, +${adds} lines\n`, { flag: 'a' });
          EOF
      - name: Slack notify
        # Optional: only runs when a Slack channel is configured as a repo variable.
        if: always() && vars.SLACK_CHANNEL_ID != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          STATIC_BLOCK: ${{ needs.static_checks.outputs.has_block }}
        run: |
          [ -z "$SLACK_BOT_TOKEN" ] && exit 0
          emoji="✅"; [ "$STATIC_BLOCK" = "true" ] && emoji="🚫"
          # Build the JSON in node so '\n' becomes a REAL newline (a shell string keeps it literal,
          # and JSON.stringify of a literal backslash-n double-escapes -> Slack shows "\n").
          payload=$(node -e "console.log(JSON.stringify({channel: process.argv[6], text: process.argv[1]+' *PR Review* — '+process.argv[2]+' #'+process.argv[3]+'\n*'+process.argv[4]+'*\n'+process.argv[5]}))" "$emoji" "$REPO" "$PR" "$TITLE" "$URL" "$SLACK_CHANNEL_ID")
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H "Content-Type: application/json" \
            -d "$payload" >/dev/null || true

  # ── 4. Auto-merge — the only job that can write, and only when switched on ──────
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    # Off unless the repository variable PR_AUTOMERGE is "on" (unset = off: bake mode and
    # kill-switch), and only for a pull request the deterministic gate called eligible.
    if: vars.PR_AUTOMERGE == 'on' && needs.gate.outputs.eligible == 'true'
    permissions:
      contents: write          # native auto-merge needs it
      pull-requests: write
    steps:
      - name: Enable native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if gh pr merge "$PR" --repo "$REPO" --squash --auto --delete-branch; then
            echo "### Auto-merge" >> "$GITHUB_STEP_SUMMARY"; echo "- enabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::auto-merge enable failed; a human merges"
          fi
